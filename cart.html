
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">🧺 Laundry Mart</div>

        <ul class="menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#services">Services</a></li>
            <li><a href="booking.html">Book Now</a></li>
        </ul>

        <div class="nav-right">
            <span class="user">Username</span>
            <button class="logout-btn" type="button">↪</button>
        </div>
    </nav>

    <!-- CART SECTION -->
    <section class="container">

        <!-- LEFT SIDE -->
        <div class="left-section">
            <h2>🛒 Shopping Cart</h2>

            <table>
                <thead>
                    <tr>
                        <th>Service</th>
                        <th>Price</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="cartTable"></tbody>
            </table>

            <div class="total-box">
                <h3>Total Amount</h3>
                <h2>₹ <span id="cartTotal">0</span></h2>
            </div>

            <br>

            <a href="index.html">

                <button type="button" class="add-btn" onclick="submit()">
                        ← Continue Shopping
                </button>
                
            </a>
        </div>

        <!-- RIGHT SIDE -->
        <div class="right-section">
            <h2>Booking Summary</h2>

            <label for="coupon">Coupon Code</label>
            <br><br>

            <input
                type="text"
                id="coupon"
                placeholder="Enter Coupon"
                style="padding:10px;width:70%;"
            >

            <button class="add-btn" type="button" onclick="applyCoupon()">
                Apply
            </button>

            <hr style="margin:30px 0;">

            <p>
                Sub Total:
                <strong>₹ <span id="subTotal">0</span></strong>
            </p>

            <br>

            <p>
                Taxes:
                <strong>₹50</strong>
            </p>

            <br>

            <p>
                Discount:
                <strong>₹<span id="discount">0</span></strong>
            </p>

            <hr style="margin:30px 0;">

            <h2>
                Total: ₹<span id="grandTotal">0</span>
            </h2>

            <button
                class="book-btn"
                type="button"
                onclick="proceedToBooking()"
            >
                Proceed To Booking
            </button>
        </div>

    </section>

    <script>
        // LOAD CART ITEMS
        let items = JSON.parse(localStorage.getItem("cartItems")) || [];
        let discountAmount = 0;

        // DISPLAY CART
        function showCart() {
            const table = document.getElementById("cartTable");

            table.innerHTML = "";

            let total = 0;

            if (items.length === 0) {
                table.innerHTML = `
                    <tr>
                        <td colspan="3" class="empty-message">
                            Your cart is empty
                        </td>
                    </tr>
                `;
            }

            items.forEach(function(item, index) {
                total += Number(item.price);

                const row = document.createElement("tr");

                const nameCell = document.createElement("td");
                nameCell.innerText = item.name;

                const priceCell = document.createElement("td");
                priceCell.innerText = "₹" + item.price;

                const actionCell = document.createElement("td");

                const removeButton = document.createElement("button");
                removeButton.innerText = "Remove";
                removeButton.className = "remove-btn";
                removeButton.type = "button";
                removeButton.addEventListener("click", function() {
                    removeItem(index);
                });

                actionCell.appendChild(removeButton);

                row.appendChild(nameCell);
                row.appendChild(priceCell);
                row.appendChild(actionCell);

                table.appendChild(row);
            });

            if (discountAmount > total) {
                discountAmount = 0;
            }

            document.getElementById("cartTotal").innerText = total;
            document.getElementById("subTotal").innerText = total;
            document.getElementById("discount").innerText = discountAmount;
            document.getElementById("grandTotal").innerText =
                Math.max(0, total + 50 - discountAmount);

            localStorage.setItem("cartItems", JSON.stringify(items));
            localStorage.setItem("totalAmount", total);
            localStorage.setItem("totalPrice", total);
        }

        // REMOVE ITEM
        function removeItem(index) {
            items.splice(index, 1);

            discountAmount = 0;

            localStorage.removeItem("couponApplied");

            showCart();
        }

        // APPLY COUPON
        function applyCoupon() {
            const coupon = document.getElementById("coupon")
                .value.trim().toUpperCase();

            const total = items.reduce(function(sum, item) {
                return sum + Number(item.price);
            }, 0);

            if (coupon === "SAVE10" && total > 0) {
                discountAmount = Math.round(total * 0.10);
                alert("10% discount applied!");
            } else {
                discountAmount = 0;
                alert("Invalid coupon code. Try SAVE10.");
            }

            showCart();
        }

        // PROCEED TO BOOKING
        function proceedToBooking() {
            if (items.length === 0) {
                alert("Your cart is empty. Please add a service first.");
                return;
            }

            window.location.href = "booking.html";
        }

        // LOGOUT
        document.querySelector(".logout-btn").addEventListener("click", function() {
            if (confirm("Do you want to logout?")) {
                localStorage.removeItem("customerName");
                localStorage.removeItem("customerEmail");
                window.location.href = "index.html";
            }
        });

        showCart();
    </script>

</body>
</html>
